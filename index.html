<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digitales Santur-Interface</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Status- und Anleitungspanel -->
    <div class="instructions" id="status-box">
        <b>Klicken/Tippen Sie auf die Saiten oder verwenden Sie die Tastatur</b>
    </div>

    <!-- Hauptcontainer für den Santur-Körper -->
    <div class="santur-container" id="santur-board"></div>

    <!-- Anzeigebereich für Noteninformationen und Notation -->
    <div class="note-display-box">
        <div class="info-panel">
            <div class="note-letter" id="note-letter">E4</div>
            <div class="note-solfege" id="note-solfege">Mi</div>
            <div class="note-details" id="note-details">Stahlsaiten – 1. Steg</div>
        </div>

        <div class="staff-svg-box">
            <svg id="staff-svg" width="230" height="150" viewBox="0 0 230 150">
                <!-- Fünf Notenlinien -->
                <line x1="10" y1="20" x2="220" y2="20" stroke="#000" stroke-width="1.2"/>
                <line x1="10" y1="28" x2="220" y2="28" stroke="#000" stroke-width="1.2"/>
                <line x1="10" y1="36" x2="220" y2="36" stroke="#000" stroke-width="1.2"/>
                <line x1="10" y1="44" x2="220" y2="44" stroke="#000" stroke-width="1.2"/>
                <line x1="10" y1="52" x2="220" y2="52" stroke="#000" stroke-width="1.4"/>
                
                <!-- Violinschlüssel -->
                <text x="12" y="50" font-family="Arial, sans-serif" font-size="34" fill="#000">🎼</text>
                
                <!-- Hilfslinien für tiefere Noten -->
                <line id="ledger-1" x1="140" y1="60" x2="170" y2="60" stroke="#000" stroke-width="1.2" visibility="hidden"/>
                <line id="ledger-2" x1="140" y1="68" x2="170" y2="68" stroke="#000" stroke-width="1.2" visibility="hidden"/>
                <line id="ledger-3" x1="140" y1="76" x2="170" y2="76" stroke="#000" stroke-width="1.2" visibility="hidden"/>
                <line id="ledger-4" x1="140" y1="84" x2="170" y2="84" stroke="#000" stroke-width="1.2" visibility="hidden"/>

                <!-- Notenkopf und Notenhals -->
                <g id="note-head-group">
                    <ellipse id="note-head" cx="155" cy="52" rx="5.5" ry="3.8" fill="#000" transform="rotate(-20 155 52)"/>
                    <line id="note-stem" x1="160" y1="52" x2="160" y2="22" stroke="#000" stroke-width="1.8"/>
                </g>
            </svg>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
